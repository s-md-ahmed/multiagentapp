name: Multi-Agent App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Grab your code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11 to match your Dockerfile (python:3.11-slim)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Fast-fail validation: Test requirements & syntax before building Docker
      - name: Install Dependencies & Check Syntax
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m compileall backend/
          echo "Python syntax and dependencies verified successfully!"

      # 4. Final Production Test: Build the exact same Docker container used for deployment
      - name: Build Docker Container
        run: |
          docker build -t multi-agent-analyzer:latest .
          echo "Docker container built successfully matching production environment!"
